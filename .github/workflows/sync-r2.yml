name: Mirror GitHub Releases to Cloudflare R2

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["Electron Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published release tag (e.g. v0.2.0-beta.2)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r2-release-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.repository == 'Leos-byte/MemoryGraph' &&
      (github.event_name == 'workflow_dispatch' || vars.R2_MIRROR_ENABLED == 'true') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      R2_BUCKET: memorygraph-releases
      DOWNLOAD_HOST: download.leoone.uk

    steps:
      - name: Check required credentials
        shell: bash
        env:
          R2_CONFIGURED: ${{ secrets.R2_ACCOUNT_ID != '' && secrets.R2_ACCESS_KEY_ID != '' && secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$R2_CONFIGURED" != "true" ]]; then
            echo "::error::Configure R2_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY in repository Actions secrets."
            exit 1
          fi
          aws --version
          gh --version

      - name: Check out trusted workflow code and release tags
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Determine published release tags
        id: tags
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/release-tags.txt"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' "$MANUAL_TAG" >> "$RUNNER_TEMP/release-tags.txt"
          elif [[ "$EVENT_NAME" == "release" ]]; then
            printf '%s\n' "$PUBLISHED_TAG" >> "$RUNNER_TEMP/release-tags.txt"
          else
            # Releases created with GITHUB_TOKEN do not emit downstream
            # release events. A completed Electron Release run does.
            git tag --points-at "$RELEASE_SHA" |
              grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' \
              > "$RUNNER_TEMP/release-tags.txt" || true
          fi

          # Avoid arbitrary paths and shell metacharacters in release tags.
          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]] || {
              echo "::error::Unexpected tag format: $tag"
              exit 1
            }
          done < "$RUNNER_TEMP/release-tags.txt"

          echo "tags_file=$RUNNER_TEMP/release-tags.txt" >> "$GITHUB_OUTPUT"

      - name: Download and verify published release assets
        id: verified
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAGS_FILE: ${{ steps.tags.outputs.tags_file }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/verified-tags.txt"

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            # Draft releases are not mirrored. Manual requests fail loudly.
            if ! gh release view "$tag" --repo "$GH_REPO" \
                --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/draft.txt"; then
              if [[ "$EVENT_NAME" == "workflow_run" ]]; then
                echo "No published release for $tag; skipping"
                continue
              fi
              exit 1
            fi
            if [[ "$(cat "$RUNNER_TEMP/draft.txt")" == "true" ]]; then
              if [[ "$EVENT_NAME" == "workflow_run" ]]; then
                echo "Draft release $tag; skipping"
                continue
              fi
              echo "::error::Release $tag is still a draft"
              exit 1
            fi

            directory="$RUNNER_TEMP/release-files/$tag"
            mkdir -p "$directory"
            gh release download "$tag" --repo "$GH_REPO" \
              --dir "$directory"
            node DevScripts/release-artifacts.mjs check-signed \
              --source "$directory" --version "${tag#v}"
            printf '%s\n' "$tag" >> "$RUNNER_TEMP/verified-tags.txt"
          done < "$TAGS_FILE"
          echo "tags_file=$RUNNER_TEMP/verified-tags.txt" >> "$GITHUB_OUTPUT"

      - name: Upload verified assets to R2
        shell: bash
        env:
          TAGS_FILE: ${{ steps.verified.outputs.tags_file }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$R2_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]] || {
            echo "::error::R2_ACCOUNT_ID must be a 32-character account ID, not a URL."
            exit 1
          }
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          mirrored=0
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            directory="$RUNNER_TEMP/release-files/$tag"

            # Publish the signed manifest last; never execute downloaded assets.
            aws s3 cp "$directory/" \
              "s3://${R2_BUCKET}/releases/$tag/" \
              --exclude 'release-manifest.json' --exclude 'release-manifest.sig' \
              --recursive --endpoint-url "$endpoint" \
              --only-show-errors --no-progress
            for name in release-manifest.sig release-manifest.json; do
              aws s3 cp "$directory/$name" \
                "s3://${R2_BUCKET}/releases/$tag/$name" \
                --endpoint-url "$endpoint" --only-show-errors --no-progress
            done

            echo "### Mirrored $tag" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r -d '' file; do
              name="$(basename "$file")"
              encoded="$(NAME="$name" python3 -c \
                'import os,urllib.parse; print(urllib.parse.quote(os.environ["NAME"],safe=""))')"
              echo "- https://${DOWNLOAD_HOST}/releases/$tag/$encoded" \
                >> "$GITHUB_STEP_SUMMARY"
            done < <(find "$directory" -maxdepth 1 \
              -type f -print0 | sort -z)
            mirrored=$((mirrored + 1))
          done < "$TAGS_FILE"

          echo "Mirrored $mirrored published release(s)."
